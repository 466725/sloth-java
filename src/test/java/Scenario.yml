execution:
-  executor: selenium
   runner: testng
   concurrency: 10
   locations:
      us-east-1: 5
      us-east-2: 5
   locations-weighted: false
   iteration: 1
   ramp-up: 1m
   scenario: ticketOne
   hold-for: 2m
   scenario: ticketTwo
   hold-for: 2m
   scenario: ticketThree
   hold-for: 2m
scenarios:
   ticketOne:
      script: ScenarioOne.java
   ticketTwo:
      script: ScenarioTwo.java
   ticketThree:
      script: ScenarioThree.java
      script: ScenarioTwo.java
   ticketFour:
      script: ScenarioFour.java