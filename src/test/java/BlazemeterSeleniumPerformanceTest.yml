execution:
-  executor: selenium
   runner: junit
   concurrency: 35
   locations:
      ca-central-1: 5
      azure-central-ca: 6
      northamerica-northeast1-a: 7
      azure-central-us-1: 8
      azure-east-ca: 9
   locations-weighted: false
   iteration: 4
   hold-for: 30m
   ramp-up: 15m
   scenario: simple
scenarios:
   simple:
      script: BlazemeterSeleniumPerformanceTest.java