services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slothdb}
      MYSQL_USER: ${MYSQL_USER:-slothuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-slothpass123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"

  appium:
    image: appium/appium:latest
    profiles: ["mobile-host"]
    ports:
      - "4723:4723"

  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    profiles: ["mobile-emulator"]
    privileged: true
    shm_size: 2gb
    ports:
      - "4723:4723"
      - "6080:6080"

  mobile-tests:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["mobile-emulator"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      APPIUM_SERVER_URL: "http://android-emulator:4723/wd/hub"
      ANDROID_DEVICE_NAME: "Android"
      SUITE_XML_FILE: "MobileSmokeTest.xml"
    depends_on:
      android-emulator:
        condition: service_started
    command: >
      bash -lc "mvn -B -ntp test
      -DsuiteXmlFile=$${SUITE_XML_FILE}"

  tests:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      HEADLESS: "true"
      SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
      SUITE_XML_FILE: "SmokeTest.xml"
    depends_on:
      selenium:
        condition: service_started
      mysql:
        condition: service_healthy
    command: >
      bash -lc "mvn -B -ntp test
      -DsuiteXmlFile=$${SUITE_XML_FILE}
      -Dheadless=$${HEADLESS}"

volumes:
  mysql_data:
