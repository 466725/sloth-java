services:
  mysql:
    image: mysql:latest
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slothdb}
      MYSQL_USER: ${MYSQL_USER:-slothuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-slothpass123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  selenium:
    image: selenium/standalone-chrome@sha256:18c17c7d95c29f21966ad6151c64aa1a3bf661c575a09f58d33c4bf2e5c66568
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"

  appium:
    image: appium/appium@sha256:db22c8f2dff3f452477c2049b50feb9720c60a9ee23e6abdd6bc2acd82dc8dba
    profiles: ["mobile-host"]
    ports:
      - "4723:4723"
    command:
      - "appium --base-path / --address 0.0.0.0 --port 4723 --allow-insecure *:adb_shell"

  android-emulator-google:
    image: us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2
    profiles: ["mobile-emulator-google"]
    privileged: true
    shm_size: 2gb
    environment:
      ADBKEY: "${ADBKEY:-}"
    ports:
      - "8554:8554"
      - "5555:5555"

  appium-google:
    image: appium/appium@sha256:db22c8f2dff3f452477c2049b50feb9720c60a9ee23e6abdd6bc2acd82dc8dba
    container_name: appium-google
    profiles: ["mobile-emulator-google"]
    depends_on:
      - android-emulator-google
    ports:
      - "4724:4723"
    command:
      - "while true; do adb connect android-emulator-google:5555 >/dev/null 2>&1 || true; sleep 5; done & exec appium --base-path / --address 0.0.0.0 --port 4723 --allow-insecure *:adb_shell"

  tests:
    image: maven@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      HEADLESS: "true"
      SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
      SUITE_XML_FILE: "${SUITE_XML_FILE:-SmokeTest.xml}"
      MOBILE_WEB_RUN_MODE: "${MOBILE_WEB_RUN_MODE:-selenium}"
    depends_on:
      selenium:
        condition: service_started
      mysql:
        condition: service_healthy
    command: >
      bash -lc "mvn -B -ntp -pl framework test
      -DsuiteXmlFile=$${SUITE_XML_FILE}
      -Dheadless=$${HEADLESS}"

volumes:
  mysql_data:
