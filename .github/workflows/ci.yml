name: sloth-java CI

on:
  pull_request:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 3 * * *"  # nightly at 03:00 UTC (adjust as you like)
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke (PR/Push)
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --health-cmd "curl -fsS http://localhost:4444/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Diagnostics (Java/Maven/POM)
        run: |
          echo "== Git =="
          git rev-parse HEAD
          echo "== pom.xml (properties section) =="
          sed -n '1,80p' pom.xml
          echo "== Java/Maven versions =="
          java -version
          mvn -version
          echo "== Environment overrides =="
          echo "MAVEN_OPTS=${MAVEN_OPTS:-<empty>}"
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:-<empty>}"
          echo "== Evaluated Maven properties =="
          mvn -q help:evaluate -Dexpression=maven.compiler.release -DforceStdout || true
          mvn -q help:evaluate -Dexpression=maven.compiler.source  -DforceStdout || true
          mvn -q help:evaluate -Dexpression=maven.compiler.target  -DforceStdout || true
          echo "== Effective compiler plugin snippet =="
          mvn -q help:effective-pom -DforceStdout | sed -n '/maven-compiler-plugin/,/\/plugin>/p'

      - name: Wait for Selenium
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4444/status | grep -q '"ready":[[:space:]]*true'; then
              echo "Selenium is ready"
              exit 0
            fi
            echo "Waiting for Selenium... ($i/30)"
            sleep 2
          done
          echo "Selenium did not become ready in time"
          exit 1

      - name: Run Smoke suite
        env:
          HEADLESS: "true"
          SELENIUM_REMOTE_URL: "http://localhost:4444/wd/hub"
          API_MANAGER_SUBSCRIPTION_KEY: ${{ secrets.API_MANAGER_SUBSCRIPTION_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "HEADLESS=${HEADLESS}"
          echo "SELENIUM_REMOTE_URL=${SELENIUM_REMOTE_URL}"
          test -n "${SELENIUM_REMOTE_URL}"
          curl -fsS http://localhost:4444/status || true
          mvn -B -U -DsuiteXmlFile=SmokeTest.xml -Dselenium.remote.url="${SELENIUM_REMOTE_URL}" test

      - name: Upload test reports/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          path: |
            test-output/**
            target/**
          if-no-files-found: warn

  regression:
    name: Regression (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --health-cmd "curl -fsS http://localhost:4444/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Wait for Selenium
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4444/status | grep -q '"ready":[[:space:]]*true'; then
              echo "Selenium is ready"
              exit 0
            fi
            echo "Waiting for Selenium... ($i/30)"
            sleep 2
          done
          echo "Selenium did not become ready in time"
          exit 1

      - name: Run Regression suite
        env:
          HEADLESS: "true"
          SELENIUM_REMOTE_URL: "http://localhost:4444/wd/hub"
          API_MANAGER_SUBSCRIPTION_KEY: ${{ secrets.API_MANAGER_SUBSCRIPTION_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "HEADLESS=${HEADLESS}"
          echo "SELENIUM_REMOTE_URL=${SELENIUM_REMOTE_URL}"
          test -n "${SELENIUM_REMOTE_URL}"
          curl -fsS http://localhost:4444/status || true
          mvn -B -U -DsuiteXmlFile=RegressionTest.xml -Dselenium.remote.url="${SELENIUM_REMOTE_URL}" test

      - name: Upload test reports/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-artifacts
          path: |
            test-output/**
            target/**
          if-no-files-found: warn
          retention-days: 30
