name: sloth-java CI

on:
  pull_request:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  smoke:
    name: Smoke Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Smoke suite with Docker Compose
        run: docker compose up --abort-on-container-exit --exit-code-from tests tests

      - name: Upload test reports/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          path: |
            test-output/**
            target/**
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose down -v

  regression-nightly:
    name: Regression Nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Regression suite with Docker Compose
        run: SUITE_XML_FILE=RegressionTest.xml docker compose up --abort-on-container-exit --exit-code-from tests tests

      - name: Upload test reports/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-artifacts
          path: |
            test-output/**
            target/**
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose down -v
