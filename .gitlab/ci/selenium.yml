selenium:
  stage: test
  needs: [build]
  timeout: 30m
  services:
    - name: selenium/standalone-chromium:4
      alias: selenium
      variables:
        HEALTHCHECK_TCP_PORT: "4444"
  variables:
    HEADLESS: "true"
    SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - |
      ready=false
      for attempt in $(seq 1 60); do
        if curl -fsS --connect-timeout 5 --max-time 10 http://selenium:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
          ready=true
          break
        fi
        sleep 2
      done
      if [ "$ready" != true ]; then
        echo "Selenium did not become ready" >&2
        exit 1
      fi
  script:
    - mvn -B -ntp -pl test-automation-framework test '-Dtest=ui.tangerine.selenium.*Test' -Dheadless=true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-automation-framework/target/surefire-reports/
      - test-automation-framework/test-output/
    reports:
      junit: test-automation-framework/target/surefire-reports/TEST-*.xml
